version: "3.8"

services:
  trading-bot:
    build:
      context: .
      dockerfile: docker/bot.dockerfile
    restart: always
    volumes:
      - ./data:/app/data
    depends_on:
      - postgres-openai-trader
    networks:
      - trading-bot-network
      - internal-network

  postgres-openai-trader:
    build:
      context: .
      dockerfile: docker/postgresql.dockerfile
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - openai-trader-postgres-data:/var/lib/postgresql/data
    networks:
      - internal-network

volumes:
  openai-trader-postgres-data:
    external: true

networks:
  trading-bot-network:
    external: true
  internal-network:
