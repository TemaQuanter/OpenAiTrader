<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" type="text/javascript"></script>
    <script>
        // Fetch data from the server before the page loads
        document.addEventListener("DOMContentLoaded", (event) => {
            fetchData();

            document
            .getElementById("dataset_form")
            .addEventListener("submit", function (e) {
                // Prevent the form's default submission
                e.preventDefault();

                // First, prepare the form data by copying contenteditable contents to hidden inputs
                prepareFormSubmission();

                // Create an object to store form data
                let formData = {
                    requests: [],
                    responses: [],
                };

                // Populate formData object with form's data
                let target_form = new FormData(e.target)

                // Iterator over the requests an responses.
                let counter = 1;
                
                // Iterate over the FormData entries
                while (target_form.get(`request_${counter}`) != null) {
                    // Check if all requests and responses were extracted.
                    formData.requests.push(target_form.get(`request_${counter}`));
                    formData.responses.push(target_form.get(`response_${counter}`));

                    counter++;
                    // Uncomment below lines to see the key and value in the console
                    // console.log(key);
                    // console.log(value);
                } // end while

                // console.log(formData);

                // Convert formData to JSON
                let jsonData = JSON.stringify(formData);

                // Use Fetch API to send a POST request with JSON payload
                fetch("http://0.0.0.0:9090/save_changes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: jsonData,
                }).catch((error) => {
                    console.error("Error:", error);
                });
            });
        });
    </script>
    <link rel="stylesheet" href="dataset.css" type="text/css">
</head>
<body>
    <form id="dataset_form" action="http://0.0.0.0:9090/save_changes" method="POST">
    </form>
</body>
</html>
