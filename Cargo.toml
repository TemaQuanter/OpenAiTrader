[package]
name = "trading_bot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tower-http = { version = "0.5.0", features = ["cors"] }
axum = "0.7.2"
cors = "0.1.0"
diesel = { version = "2.1.3", features = ["postgres", "r2d2", "chrono"] }
base64 = "0.21.4"
chatgpt_rs = "1.2.3"
crypto-botters = { version = "0.6.0", features = ["bybit"] }
dotenv = "0.15.0"
flexi_logger = "0.27.0"
log = "0.4.20"
rust_decimal = { version = "1.32.0", features = [
    "db-diesel2-postgres",
    "db-tokio-postgres",
    "db-postgres",
] }
rust_decimal_macros = "1.32.0"
serde = "1.0.188"
serde_json = "1.0.107"
teloxide = { version = "0.12.2", features = ["macros", "throttle"] }
tokio = { version = "1.32.0", features = ["full"] }
chrono = { version = "0.4.31", features = ["serde"] }
